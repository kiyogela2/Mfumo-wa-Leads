<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Mfumo wa Leads - Supabase Integration</title>
    <!-- 1. Pakua Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h2>Mfumo wa Kusanya Leads</h2>
    
    <!-- Fomu ya Mfano ya Kuingiza Lead -->
    <form id="leadForm">
        <input type="text" id="jina" placeholder="Jina Kamili" required><br><br>
        <input type="text" id="simu" placeholder="Namba ya Simu" required><br><br>
        <textarea id="mahitaji" placeholder="Mahitaji / Maelezo"></textarea><br><br>
        <button type="submit">Hifadhi Lead</button>
    </form>

    <script>
        // 2. Funguo zako za Supabase zilizounganishwa rasmi
        const SUPABASE_URL = 'https://vysoduunjqmslxejmymm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ElBceR-sidt7GccpbLphxg_sY5bKG-M';

        // Anzisha muunganiko
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Kitendo cha kusikiliza fomu ikitumwa
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const jinaKamili = document.getElementById('jina').value;
            const nambaYaSimu = document.getElementById('simu').value;
            const mahitaji = document.getElementById('mahitaji').value;

            // Kutuma data kwenye table ya 'leads' ndani ya Supabase
            const { data, error } = await _supabase
                .from('leads')
                .insert([
                    { jina_kamili: jinaKamili, namba_ya_simu: nambaYaSimu, mahitaji: mahitaji }
                ]);

            if (error) {
                console.error('Hitilafu:', error);
                alert('Imeshindikana kuhifadhi lead.');
            } else {
                alert('Lead imehifadhiwa kikamilifu kwenye Database!');
                document.getElementById('leadForm').reset();
            }
        });
    </script>

</body>
</html>
